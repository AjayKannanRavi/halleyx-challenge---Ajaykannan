services:
  - type: web
    name: halleyx-backend
    env: node
    plan: free
    region: oregon
    buildCommand: ./backend/render-build.sh
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: 10000
